<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" width="1440" height="620" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B5FA5"/><stop offset="1" stop-color="#38A0F0"/></linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D97706"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#34507C"/></linearGradient>
    <linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C2B4A"/><stop offset="1" stop-color="#2B4470"/></linearGradient>
    <linearGradient id="gCloud" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1F4F8"/><stop offset="1" stop-color="#DDE3EC"/></linearGradient>
    <linearGradient id="gLaneA" gradientUnits="userSpaceOnUse" x1="452" y1="0" x2="986" y2="0"><stop offset="0" stop-color="#14213D" stop-opacity="0.15"/><stop offset="1" stop-color="#0B5FA5"/></linearGradient>
    <linearGradient id="gLaneB" gradientUnits="userSpaceOnUse" x1="986" y1="0" x2="452" y2="0"><stop offset="0" stop-color="#D97706" stop-opacity="0.2"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#14213D" flood-opacity="0.16"/></filter>
    <filter id="sh2" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#14213D" flood-opacity="0.14"/></filter>
    <filter id="glowB" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2E8FE0" flood-opacity="0.7"/></filter>
    <filter id="glowO" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.7"/></filter>
    <marker id="mB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B5FA5"/></marker>
    <marker id="mO" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
  </defs>

  <!-- ambient colour blobs -->
  <circle cx="230" cy="120" r="150" fill="#38A0F0" opacity="0.28" filter="url(#blur)"/>
  <circle cx="1210" cy="500" r="170" fill="#8A94A1" opacity="0.30" filter="url(#blur)"/>
  <circle cx="720" cy="560" r="120" fill="#F59E0B" opacity="0.22" filter="url(#blur)"/>

  <!-- ===== left: researcher PC ===== -->
  <g filter="url(#sh)"><rect x="20" y="30" width="420" height="560" rx="32" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFFFFF" stroke-width="2"/></g>
  <rect x="48" y="58" width="130" height="38" rx="19" fill="url(#gNavy)"/>
  <text x="113" y="84" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">내 PC</text>

  <!-- laptop -->
  <g filter="url(#sh2)">
    <rect x="80" y="130" width="300" height="190" rx="18" fill="url(#gScreen)"/>
    <path d="M52,330 h356 l-22,24 h-312 z" fill="#C9D0DB"/>
    <rect x="190" y="330" width="80" height="8" rx="4" fill="#A3ACBA"/>
  </g>
  <rect x="94" y="144" width="272" height="162" rx="10" fill="#14213D" opacity="0.55"/>
  <!-- csv card -->
  <g filter="url(#sh2)"><rect x="112" y="170" width="100" height="110" rx="12" fill="#FFFFFF"/></g>
  <rect x="112" y="170" width="100" height="34" rx="12" fill="url(#gBlue)"/><rect x="112" y="190" width="100" height="14" fill="url(#gBlue)"/>
  <text x="162" y="194" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">CSV</text>
  <g stroke="#B9C9DC" stroke-width="4" stroke-linecap="round"><line x1="126" y1="222" x2="198" y2="222"/><line x1="126" y1="240" x2="198" y2="240"/><line x1="126" y1="258" x2="170" y2="258"/></g>
  <!-- doc card -->
  <g filter="url(#sh2)"><rect x="236" y="170" width="100" height="110" rx="12" fill="#FFFFFF"/></g>
  <rect x="236" y="170" width="100" height="34" rx="12" fill="#8A94A1"/><rect x="236" y="190" width="100" height="14" fill="#8A94A1"/>
  <text x="286" y="194" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">원고</text>
  <g stroke="#D3D9E2" stroke-width="4" stroke-linecap="round"><line x1="250" y1="222" x2="322" y2="222"/><line x1="250" y1="240" x2="322" y2="240"/><line x1="250" y1="258" x2="296" y2="258"/></g>

  <!-- researcher -->
  <circle cx="230" cy="440" r="86" fill="url(#gOrange)" opacity="0.14"/>
  <circle cx="230" cy="424" r="30" fill="url(#gOrange)"/>
  <path d="M172,512 q58,-86 116,0 z" fill="url(#gOrange)"/>
  <text x="230" y="556" font-size="23" font-weight="700" fill="#14213D" text-anchor="middle">연구자</text>
  <rect x="300" y="400" width="124" height="42" rx="21" fill="#FFF7ED" stroke="#F0C48A" stroke-width="1.5"/>
  <text x="362" y="428" font-size="19" fill="#B45309" text-anchor="middle">직접 옮김</text>

  <!-- ===== right: web chatbot ===== -->
  <g filter="url(#sh)"><rect x="1000" y="30" width="420" height="560" rx="32" fill="url(#gCloud)"/></g>
  <rect x="1000" y="30" width="420" height="560" rx="32" fill="none" stroke="#8A94A1" stroke-width="2.5" stroke-dasharray="3 12" stroke-linecap="round"/>
  <g transform="translate(1032,62)"><path d="M18,34 a12,12 0 0 1 -2,-24 a17,17 0 0 1 33,-5 a14,14 0 0 1 3,29 z" fill="#FFFFFF" stroke="#8A94A1" stroke-width="2.5"/></g>
  <text x="1096" y="88" font-size="27" font-weight="700" fill="#14213D">웹 챗봇</text>
  <text x="1206" y="88" font-size="20" fill="#6A7179">외부 서버</text>

  <g filter="url(#sh2)"><rect x="1030" y="124" width="360" height="438" rx="22" fill="#FFFFFF"/></g>
  <rect x="1030" y="124" width="360" height="40" rx="22" fill="#F3F5F8"/><rect x="1030" y="144" width="360" height="20" fill="#F3F5F8"/>
  <circle cx="1056" cy="144" r="6" fill="#E05B5B"/><circle cx="1076" cy="144" r="6" fill="#F0B640"/><circle cx="1096" cy="144" r="6" fill="#5BC06A"/>
  <!-- user bubble -->
  <g filter="url(#sh2)"><path d="M1130,190 h232 a18,18 0 0 1 18,18 v62 a18,18 0 0 1 -18,18 h-232 a18,18 0 0 1 -18,-18 v-62 a18,18 0 0 1 18,-18 z" fill="url(#gBlue)"/></g>
  <text x="1134" y="226" font-size="22" fill="#FFFFFF">이 데이터로</text>
  <text x="1134" y="258" font-size="22" font-weight="700" fill="#FFFFFF">회귀분석 해줘</text>
  <!-- bot bubble -->
  <rect x="1050" y="306" width="290" height="170" rx="20" fill="#EEF1F5"/>
  <circle cx="1080" cy="336" r="13" fill="url(#gNavy)"/>
  <text x="1104" y="342" font-size="17" fill="#6A7179">AI 답변</text>
  <g font-size="21" fill="#14213D"><text x="1072" y="384">결과 표</text><text x="1072" y="420">해석 문장</text><text x="1072" y="456">예시 코드</text></g>
  <rect x="1050" y="494" width="320" height="46" rx="23" fill="#F7F7F2" stroke="#D9DEE7" stroke-width="2"/>
  <text x="1074" y="524" font-size="19" fill="#8A94A1">메시지 입력</text>
  <circle cx="1346" cy="517" r="15" fill="url(#gBlue)"/>
  <path d="M1340,517 h12 m-5,-5 l5,5 l-5,5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== flow lanes ===== -->
  <path d="M452,190 C620,130 820,130 986,190" fill="none" stroke="url(#gLaneA)" stroke-width="5" stroke-linecap="round" marker-end="url(#mB)"/>
  <circle cx="598" cy="144" r="5.5" fill="#38A0F0"/><circle cx="720" cy="136" r="5.5" fill="#0B5FA5"/><circle cx="842" cy="146" r="5.5" fill="#0B5FA5"/>
  <g filter="url(#glowB)"><circle cx="720" cy="120" r="26" fill="url(#gBlue)"/></g>
  <text x="720" y="130" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <g filter="url(#sh2)"><rect x="604" y="160" width="232" height="44" rx="22" fill="#FFFFFF"/></g>
  <text x="720" y="190" font-size="22" font-weight="700" fill="#14213D" text-anchor="middle">파일 업로드</text>

  <path d="M452,330 L986,330" fill="none" stroke="url(#gLaneA)" stroke-width="5" stroke-linecap="round" marker-end="url(#mB)"/>
  <circle cx="580" cy="330" r="5.5" fill="#38A0F0"/><circle cx="720" cy="330" r="0" fill="#0B5FA5"/><circle cx="860" cy="330" r="5.5" fill="#0B5FA5"/>
  <g filter="url(#glowB)"><circle cx="720" cy="290" r="26" fill="url(#gBlue)"/></g>
  <text x="720" y="300" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <g filter="url(#sh2)"><rect x="604" y="338" width="232" height="44" rx="22" fill="#FFFFFF"/></g>
  <text x="720" y="368" font-size="22" font-weight="700" fill="#14213D" text-anchor="middle">채팅창에 질문</text>

  <path d="M986,470 C820,530 620,530 452,470" fill="none" stroke="url(#gLaneB)" stroke-width="5" stroke-linecap="round" marker-end="url(#mO)"/>
  <circle cx="842" cy="508" r="5.5" fill="#F59E0B"/><circle cx="720" cy="515" r="5.5" fill="#D97706"/><circle cx="598" cy="508" r="5.5" fill="#D97706"/>
  <g filter="url(#glowO)"><circle cx="720" cy="458" r="26" fill="url(#gOrange)"/></g>
  <text x="720" y="468" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <g filter="url(#sh2)"><rect x="590" y="534" width="260" height="44" rx="22" fill="#FFF7ED" stroke="#F0C48A" stroke-width="1.5"/></g>
  <text x="720" y="564" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle">답을 원고로 복사</text>
</svg>

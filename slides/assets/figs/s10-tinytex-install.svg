<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 300" width="1440" height="300" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B5FA5"/><stop offset="1" stop-color="#38A0F0"/></linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#34507C"/></linearGradient>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F6FA"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.14"/></filter>
    <clipPath id="c0"><rect x="20" y="20" width="440" height="260" rx="22"/></clipPath>
    <clipPath id="c1"><rect x="500" y="20" width="440" height="260" rx="22"/></clipPath>
    <clipPath id="c2"><rect x="980" y="20" width="440" height="260" rx="22"/></clipPath>
  </defs>

  <!-- route A: quarto -->
  <g filter="url(#sh)"><rect x="20" y="20" width="440" height="260" rx="22" fill="url(#gCard)" stroke="#0B5FA5" stroke-width="2"/></g>
  <g clip-path="url(#c0)"><rect x="20" y="20" width="440" height="60" fill="url(#gBlue)"/></g>
  <circle cx="56" cy="50" r="18" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
  <text x="56" y="57" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
  <text x="88" y="58" font-size="22" font-weight="700" fill="#FFFFFF">Quarto로 설치 (권장)</text>
  <rect x="44" y="100" width="392" height="44" rx="10" fill="#14213D"/>
  <text x="62" y="128" font-size="17" fill="#8FA3BF" font-family="Consolas,'JetBrains Mono',monospace">PS&gt; quarto install tinytex</text>
  <text x="44" y="180" font-size="19" fill="#4A5568">Positron 터미널에서 한 줄</text>
  <text x="44" y="210" font-size="19" fill="#4A5568">PATH를 건드리지 않음, 관리자 권한 불필요</text>
  <text x="44" y="240" font-size="19" fill="#4A5568">확인 quarto check, 갱신 quarto update</text>

  <!-- route B: R -->
  <g filter="url(#sh)"><rect x="500" y="20" width="440" height="260" rx="22" fill="url(#gCard)" stroke="#E3E8EF" stroke-width="1.5"/></g>
  <g clip-path="url(#c1)"><rect x="500" y="20" width="440" height="60" fill="url(#gNavy)"/></g>
  <circle cx="536" cy="50" r="18" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <text x="536" y="57" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
  <text x="568" y="58" font-size="22" font-weight="700" fill="#FFFFFF">R 패키지로 설치</text>
  <rect x="524" y="100" width="392" height="68" rx="10" fill="#14213D"/>
  <text x="542" y="126" font-size="17" fill="#8FA3BF" font-family="Consolas,'JetBrains Mono',monospace">install.packages("tinytex")</text>
  <text x="542" y="152" font-size="17" fill="#8FA3BF" font-family="Consolas,'JetBrains Mono',monospace">tinytex::install_tinytex()</text>
  <text x="524" y="204" font-size="19" fill="#4A5568">R Markdown, knitr PDF에도 같이 쓰임</text>
  <text x="524" y="234" font-size="19" fill="#4A5568">Windows 경로: %APPDATA%\TinyTeX</text>
  <text x="524" y="264" font-size="18" fill="#6A7179">둘 중 하나만 설치</text>

  <!-- what it is -->
  <g filter="url(#sh)"><rect x="980" y="20" width="440" height="260" rx="22" fill="url(#gCard)" stroke="#E3E8EF" stroke-width="1.5"/></g>
  <g clip-path="url(#c2)"><rect x="980" y="20" width="440" height="60" fill="url(#gNavy)"/></g>
  <g transform="translate(1004,36)" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="30" height="28" rx="5"/><path d="M7,9 h16 M7,15 h16 M7,21 h9"/></g>
  <text x="1050" y="58" font-size="22" font-weight="700" fill="#FFFFFF">TinyTeX란</text>
  <text x="1004" y="118" font-size="19" fill="#4A5568">TeX Live의 경량판, 약 100MB</text>
  <text x="1004" y="150" font-size="19" fill="#4A5568">전체 TeX Live는 수 GB</text>
  <text x="1004" y="182" font-size="19" fill="#4A5568">없는 패키지는 렌더 중 자동 설치</text>
  <rect x="1004" y="204" width="392" height="56" rx="12" fill="#FFF7ED" stroke="#F0C48A"/>
  <text x="1022" y="228" font-size="17" font-weight="700" fill="#B45309">대안: Typst</text>
  <text x="1022" y="250" font-size="16" fill="#B45309">Quarto 내장, LaTeX 없이 pdf. 저널 양식은 LaTeX</text>
</svg>

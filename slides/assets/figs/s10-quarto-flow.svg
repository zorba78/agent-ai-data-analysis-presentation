<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 330" width="1440" height="330" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B5FA5"/><stop offset="1" stop-color="#38A0F0"/></linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#34507C"/></linearGradient>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F6FA"/></linearGradient>
    <linearGradient id="gOut" gradientUnits="userSpaceOnUse" x1="560" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#0B5FA5"/><stop offset="1" stop-color="#8A94A1"/></linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.14"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#2E8FE0" flood-opacity="0.5"/></filter>
    <marker id="mG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A1"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B5FA5"/></marker>
  </defs>

  <circle cx="720" cy="165" r="150" fill="#38A0F0" opacity="0.18" filter="url(#blur)"/>

  <!-- source: qmd -->
  <g filter="url(#sh)"><rect x="40" y="60" width="330" height="210" rx="22" fill="url(#gCard)" stroke="#E3E8EF" stroke-width="1.5"/></g>
  <rect x="40" y="60" width="330" height="8" rx="4" fill="url(#gNavy)"/>
  <g transform="translate(66,96)" fill="none" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2,0 h18 l10,10 v26 h-28 z M20,0 v10 h10 M9,20 h12 M9,28 h12"/></g>
  <text x="112" y="124" font-size="24" font-weight="700" fill="#14213D">원고.qmd</text>
  <text x="66" y="166" font-size="19" fill="#4A5568">글: Markdown</text>
  <text x="66" y="196" font-size="19" fill="#4A5568">표, 그림: R 코드 청크</text>
  <text x="66" y="226" font-size="19" fill="#4A5568">인용: references.bib</text>
  <text x="66" y="256" font-size="18" fill="#6A7179">숫자가 코드에서 나옴</text>

  <!-- engine -->
  <path d="M374,165 L556,165" stroke="#0B5FA5" stroke-width="4" stroke-linecap="round" marker-end="url(#mB)"/>
  <g filter="url(#glow)"><rect x="562" y="110" width="316" height="110" rx="24" fill="url(#gBlue)"/></g>
  <g transform="translate(600,134)">
    <circle cx="26" cy="26" r="24" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2"/>
    <rect x="12" y="12" width="12" height="12" rx="2" fill="#FFFFFF" fill-opacity="0.55"/>
    <rect x="28" y="12" width="12" height="12" rx="2" fill="#FFFFFF" fill-opacity="0.8"/>
    <rect x="12" y="28" width="12" height="12" rx="2" fill="#FFFFFF" fill-opacity="0.8"/>
    <rect x="28" y="28" width="12" height="12" rx="2" fill="#FFFFFF"/>
  </g>
  <text x="746" y="158" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Quarto</text>
  <text x="746" y="194" font-size="18" fill="#DCEAF7" text-anchor="middle">quarto render 원고.qmd</text>
  <rect x="590" y="236" width="260" height="34" rx="17" fill="#DCEAF7"/>
  <text x="720" y="259" font-size="17" font-weight="700" fill="#0B5FA5" text-anchor="middle">Positron에 내장, 별도 설치 없음</text>

  <!-- outputs -->
  <path d="M884,150 C960,150 980,78 1056,78" fill="none" stroke="url(#gOut)" stroke-width="3.5" marker-end="url(#mG)"/>
  <path d="M884,160 C960,160 980,136 1056,136" fill="none" stroke="url(#gOut)" stroke-width="3.5" marker-end="url(#mG)"/>
  <path d="M884,170 C960,170 980,194 1056,194" fill="none" stroke="url(#gOut)" stroke-width="3.5" marker-end="url(#mG)"/>
  <path d="M884,180 C960,180 980,252 1056,252" fill="none" stroke="url(#gOut)" stroke-width="3.5" marker-end="url(#mG)"/>
  <g filter="url(#sh)">
    <rect x="1062" y="54" width="338" height="48" rx="14" fill="url(#gCard)" stroke="#E3E8EF"/>
    <rect x="1062" y="112" width="338" height="48" rx="14" fill="url(#gCard)" stroke="#E3E8EF"/>
    <rect x="1062" y="170" width="338" height="48" rx="14" fill="url(#gCard)" stroke="#E3E8EF"/>
    <rect x="1062" y="228" width="338" height="48" rx="14" fill="url(#gCard)" stroke="#E3E8EF"/>
  </g>
  <rect x="1062" y="54" width="8" height="48" rx="4" fill="#0B5FA5"/><text x="1086" y="86" font-size="19" font-weight="700" fill="#14213D">docx</text><text x="1160" y="86" font-size="18" fill="#4A5568">투고 원고, 응답서</text>
  <rect x="1062" y="112" width="8" height="48" rx="4" fill="#0B5FA5"/><text x="1086" y="144" font-size="19" font-weight="700" fill="#14213D">pdf</text><text x="1160" y="144" font-size="18" fill="#4A5568">LaTeX 또는 Typst 경유</text>
  <rect x="1062" y="170" width="8" height="48" rx="4" fill="#0B5FA5"/><text x="1086" y="202" font-size="19" font-weight="700" fill="#14213D">html</text><text x="1160" y="202" font-size="18" fill="#4A5568">분석 보고서, 웹 문서</text>
  <rect x="1062" y="228" width="8" height="48" rx="4" fill="#D97706"/><text x="1086" y="260" font-size="19" font-weight="700" fill="#14213D">revealjs</text><text x="1196" y="260" font-size="18" fill="#4A5568">이 발표자료</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 470" width="1440" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1C2B4A"/><stop offset="1" stop-color="#2F4A6E"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B5FA5"/><stop offset="1" stop-color="#2E8FE0"/></linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.18"/></filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#2E8FE0" flood-opacity="0.6"/></filter>
  </defs>

  <!-- window -->
  <g filter="url(#sh)"><rect x="20" y="10" width="1000" height="450" rx="18" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.5"/></g>
  <rect x="20" y="10" width="1000" height="38" rx="18" fill="url(#gBar)"/>
  <rect x="20" y="30" width="1000" height="18" fill="#2F4A6E"/>
  <circle cx="48" cy="29" r="6" fill="#E05B5B"/><circle cx="68" cy="29" r="6" fill="#F0B640"/><circle cx="88" cy="29" r="6" fill="#5BC06A"/>
  <text x="520" y="35" font-size="17" fill="#BFD8F0" text-anchor="middle">Positron</text>

  <!-- editor -->
  <rect x="34" y="60" width="440" height="220" rx="10" fill="#F7F7F2" stroke="#D9DEE7"/>
  <text x="50" y="86" font-size="17" font-weight="700" fill="#14213D">에디터</text>
  <text x="112" y="86" font-size="15" fill="#6A7179">R 스크립트, qmd</text>
  <g stroke="#C9D0DB" stroke-width="5" stroke-linecap="round"><line x1="52" y1="112" x2="300" y2="112"/><line x1="52" y1="136" x2="400" y2="136"/><line x1="70" y1="160" x2="350" y2="160"/><line x1="70" y1="184" x2="260" y2="184"/><line x1="52" y1="208" x2="380" y2="208"/><line x1="52" y1="232" x2="220" y2="232"/></g>

  <!-- console -->
  <rect x="34" y="292" width="440" height="158" rx="10" fill="#14213D"/>
  <text x="50" y="318" font-size="17" font-weight="700" fill="#F7F7F2">R 콘솔</text>
  <text x="122" y="318" font-size="15" fill="#7FB3E6">에이전트가 실행한 코드도 여기에 표시</text>
  <g stroke="#3D4F6E" stroke-width="5" stroke-linecap="round"><line x1="52" y1="344" x2="330" y2="344"/><line x1="52" y1="368" x2="260" y2="368"/><line x1="52" y1="392" x2="380" y2="392"/><line x1="52" y1="416" x2="200" y2="416"/></g>

  <!-- variables -->
  <rect x="486" y="60" width="270" height="220" rx="10" fill="#EEF1F5" stroke="#D9DEE7"/>
  <text x="502" y="86" font-size="17" font-weight="700" fill="#14213D">Variables</text>
  <text x="502" y="108" font-size="15" fill="#6A7179">객체 목록</text>
  <rect x="502" y="124" width="238" height="30" rx="6" fill="#FFFFFF"/><text x="514" y="145" font-size="15" fill="#14213D">fit_logistic</text><text x="728" y="145" font-size="13" fill="#6A7179" text-anchor="end">list</text>
  <rect x="502" y="160" width="238" height="30" rx="6" fill="#FFFFFF"/><text x="514" y="181" font-size="15" fill="#14213D">tbl_summary</text><text x="728" y="181" font-size="13" fill="#6A7179" text-anchor="end">table</text>
  <rect x="502" y="196" width="238" height="30" rx="6" fill="#FFFFFF"/><text x="514" y="217" font-size="15" fill="#14213D">dat_analysis</text><text x="728" y="217" font-size="13" fill="#6A7179" text-anchor="end">data.frame</text>

  <!-- plots -->
  <rect x="768" y="60" width="238" height="220" rx="10" fill="#F7F7F2" stroke="#D9DEE7"/>
  <text x="784" y="86" font-size="17" font-weight="700" fill="#14213D">Plots, Viewer</text>
  <g fill="none" stroke="#0B5FA5" stroke-width="3" stroke-linecap="round"><path d="M792,250 L792,120 M792,250 L985,250"/></g>
  <rect x="810" y="190" width="28" height="58" rx="4" fill="#7FB3E6"/><rect x="850" y="160" width="28" height="88" rx="4" fill="#0B5FA5"/><rect x="890" y="205" width="28" height="43" rx="4" fill="#7FB3E6"/><rect x="930" y="140" width="28" height="108" rx="4" fill="#0B5FA5"/>

  <!-- terminal with Claude Code -->
  <g filter="url(#glow)"><rect x="486" y="292" width="520" height="158" rx="10" fill="url(#gBlue)"/></g>
  <text x="504" y="318" font-size="17" font-weight="700" fill="#FFFFFF">터미널: Claude Code</text>
  <rect x="504" y="334" width="484" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.18"/>
  <text x="520" y="360" font-size="16" fill="#FFFFFF">&gt; 분석 데이터셋의 변수 구조를 집계로만 요약</text>
  <rect x="504" y="384" width="330" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="520" y="410" font-size="16" fill="#DCEAF7">R 세션에서 실행 중</text>

  <!-- callouts -->
  <g>
    <rect x="1050" y="70" width="380" height="104" rx="16" fill="#FFFFFF" stroke="#D9DEE7"/><rect x="1050" y="70" width="8" height="104" rx="4" fill="#0B5FA5"/>
    <text x="1076" y="106" font-size="22" font-weight="700" fill="#14213D">같은 R 세션</text>
    <text x="1076" y="140" font-size="19" fill="#4A5568">에이전트가 만든 객체가 Variables에 표시</text>
    <rect x="1050" y="190" width="380" height="104" rx="16" fill="#FFFFFF" stroke="#D9DEE7"/><rect x="1050" y="190" width="8" height="104" rx="4" fill="#0B5FA5"/>
    <text x="1076" y="226" font-size="22" font-weight="700" fill="#14213D">직접 확인</text>
    <text x="1076" y="260" font-size="19" fill="#4A5568">그림은 Plots, 데이터는 Data Explorer</text>
    <rect x="1050" y="310" width="380" height="104" rx="16" fill="#FFF7ED" stroke="#F0C48A"/><rect x="1050" y="310" width="8" height="104" rx="4" fill="#D97706"/>
    <text x="1076" y="346" font-size="22" font-weight="700" fill="#14213D">직접 수정</text>
    <text x="1076" y="380" font-size="19" fill="#4A5568">에디터에서 고치고 한 줄씩 재실행</text>
  </g>
</svg>

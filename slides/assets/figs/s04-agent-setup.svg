<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" width="1440" height="620" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <!-- Layout grid: PC panel x 20-1000 (centre 510). Boxes left x 60-330, right x 690-960.
       Rows y 72-188 and 462-578 (centre 325). Hub x 379-641, y 267-383, centred at (510,325).
       Every arrow tip stops 6-10 px short of the box it points to. -->
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B5FA5"/><stop offset="1" stop-color="#38A0F0"/></linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#34507C"/></linearGradient>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F6FA"/></linearGradient>
    <linearGradient id="gPeach" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7ED"/><stop offset="1" stop-color="#FDE7C4"/></linearGradient>
    <linearGradient id="gPC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#E8F0F9" stop-opacity="0.85"/></linearGradient>
    <linearGradient id="gOut" gradientUnits="userSpaceOnUse" x1="650" y1="0" x2="1042" y2="0"><stop offset="0" stop-color="#0B5FA5"/><stop offset="1" stop-color="#8A94A1"/></linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#14213D" flood-opacity="0.16"/></filter>
    <filter id="sh2" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#14213D" flood-opacity="0.14"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#2E8FE0" flood-opacity="0.55"/></filter>
    <marker id="mB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B5FA5"/></marker>
    <marker id="mO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A1"/></marker>
  </defs>

  <!-- ambient -->
  <circle cx="510" cy="325" r="220" fill="#38A0F0" opacity="0.22" filter="url(#blur)"/>
  <circle cx="840" cy="540" r="140" fill="#F59E0B" opacity="0.16" filter="url(#blur)"/>
  <circle cx="1240" cy="140" r="150" fill="#8A94A1" opacity="0.12" filter="url(#blur)"/>

  <!-- PC boundary -->
  <g filter="url(#sh)"><rect x="20" y="40" width="980" height="560" rx="34" fill="url(#gPC)" stroke="#FFFFFF" stroke-width="2"/></g>
  <rect x="20" y="40" width="980" height="560" rx="34" fill="none" stroke="#0B5FA5" stroke-width="2.5" stroke-dasharray="3 12" stroke-linecap="round"/>
  <rect x="48" y="22" width="320" height="40" rx="20" fill="url(#gNavy)"/>
  <g transform="translate(66,32)" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="26" height="20" rx="4"/><path d="M0,7 h26 M9,7 v13"/></g>
  <text x="104" y="49" font-size="20" font-weight="700" fill="#FFFFFF">내 PC, Positron 창 하나</text>

  <!-- inner edges -->
  <path d="M195,198 L195,452" stroke="#0B5FA5" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-start="url(#mB)" marker-end="url(#mB)"/>
  <rect x="207" y="310" width="64" height="30" rx="15" fill="#DCEAF7"/><text x="239" y="331" font-size="17" fill="#0B5FA5" text-anchor="middle">로드</text>
  <path d="M400,258 L322,196" stroke="#0B5FA5" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-start="url(#mB)" marker-end="url(#mB)"/>
  <rect x="266" y="214" width="64" height="30" rx="15" fill="#DCEAF7"/><text x="298" y="235" font-size="17" fill="#0B5FA5" text-anchor="middle">실행</text>
  <path d="M620,258 L698,196" stroke="#0B5FA5" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-start="url(#mB)" marker-end="url(#mB)"/>
  <rect x="680" y="214" width="110" height="30" rx="15" fill="#DCEAF7"/><text x="735" y="235" font-size="17" fill="#0B5FA5" text-anchor="middle">읽기, 쓰기</text>
  <path d="M700,455 L626,393" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mO)"/>
  <rect x="570" y="420" width="64" height="30" rx="15" fill="#FFF7ED" stroke="#F0C48A"/><text x="602" y="441" font-size="17" font-weight="700" fill="#B45309" text-anchor="middle">지침</text>

  <!-- outer edges -->
  <path d="M650,315 C820,315 900,200 1042,188" fill="none" stroke="url(#gOut)" stroke-width="3.5" marker-start="url(#mB)" marker-end="url(#mG)"/>
  <circle cx="802" cy="282" r="5" fill="#0B5FA5"/><circle cx="909" cy="229" r="5" fill="#5B7CA6"/>
  <path d="M650,337 C820,337 900,452 1042,455" fill="none" stroke="url(#gOut)" stroke-width="3.5" marker-end="url(#mG)"/>
  <circle cx="802" cy="370" r="5" fill="#0B5FA5"/><circle cx="909" cy="420" r="5" fill="#5B7CA6"/>

  <!-- inner nodes -->
  <g filter="url(#sh2)">
    <rect x="60" y="72" width="270" height="116" rx="20" fill="url(#gCard)"/>
    <rect x="60" y="462" width="270" height="116" rx="20" fill="url(#gCard)"/>
    <rect x="690" y="72" width="270" height="116" rx="20" fill="url(#gCard)"/>
    <rect x="690" y="462" width="270" height="116" rx="20" fill="url(#gPeach)" stroke="#F0C48A" stroke-width="2"/>
  </g>
  <circle cx="96" cy="108" r="18" fill="#DCEAF7"/><g transform="translate(86,98)" fill="none" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round"><path d="M2,18 L8,6 L13,14 L18,2"/></g>
  <text x="126" y="116" font-size="26" font-weight="700" fill="#14213D">R 세션</text>
  <text x="86" y="158" font-size="19" fill="#4A5568">분석 실행, 결과 객체</text>
  <circle cx="96" cy="498" r="18" fill="#DCEAF7"/><g transform="translate(87,489)" fill="none" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9" cy="4" rx="8" ry="3"/><path d="M1,4 v10 c0,2 4,3 8,3 s8,-1 8,-3 v-10 M1,9 c0,2 4,3 8,3 s8,-1 8,-3"/></g>
  <text x="126" y="506" font-size="26" font-weight="700" fill="#14213D">데이터 파일</text>
  <text x="86" y="548" font-size="19" fill="#4A5568">원자료는 PC 안에</text>
  <circle cx="726" cy="108" r="18" fill="#DCEAF7"/><g transform="translate(717,98)" fill="none" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2,2 h8 l4,4 h6 v12 h-18 z"/></g>
  <text x="756" y="116" font-size="26" font-weight="700" fill="#14213D">프로젝트 파일</text>
  <text x="716" y="158" font-size="19" fill="#4A5568">코드, 표, 원고</text>
  <circle cx="726" cy="498" r="18" fill="#FDE7C4"/><g transform="translate(718,488)" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2,0 h9 l5,5 v15 h-14 z M11,0 v5 h5 M5,10 h7 M5,15 h7"/></g>
  <text x="756" y="506" font-size="26" font-weight="700" fill="#14213D">CLAUDE.md</text>
  <text x="716" y="548" font-size="19" fill="#4A5568">규칙, 지난 결정(memory)</text>

  <!-- hub, centred at (510,325) -->
  <circle cx="510" cy="325" r="92" fill="#38A0F0" opacity="0.15"/>
  <g filter="url(#glow)"><rect x="379" y="267" width="262" height="116" rx="26" fill="url(#gBlue)"/></g>
  <rect x="379" y="267" width="262" height="58" rx="26" fill="#FFFFFF" fill-opacity="0.12"/>
  <g transform="translate(395,288)" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="40" height="32" rx="7"/><path d="M9,11 l7,5 l-7,5 M21,23 h11"/></g>
  <text x="535" y="314" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Claude Code</text>
  <text x="510" y="358" font-size="18" fill="#DCEAF7" text-anchor="middle">읽기, 쓰기, 실행</text>

  <!-- external nodes -->
  <g filter="url(#sh)">
    <rect x="1052" y="104" width="368" height="170" rx="24" fill="url(#gCard)" stroke="#D9DEE7" stroke-width="1.5"/>
    <rect x="1052" y="370" width="368" height="170" rx="24" fill="url(#gCard)" stroke="#D9DEE7" stroke-width="1.5"/>
  </g>
  <rect x="1052" y="104" width="368" height="8" rx="4" fill="url(#gNavy)"/>
  <rect x="1052" y="370" width="368" height="8" rx="4" fill="#8A94A1"/>
  <circle cx="1090" cy="150" r="20" fill="#DCEAF7"/><g transform="translate(1078,140)" fill="none" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round"><rect x="0" y="0" width="24" height="8" rx="2"/><rect x="0" y="12" width="24" height="8" rx="2"/></g>
  <text x="1122" y="158" font-size="24" font-weight="700" fill="#14213D">Claude 모델</text>
  <text x="1078" y="198" font-size="19" fill="#4A5568">Anthropic 서버에서 추론</text>
  <text x="1078" y="226" font-size="19" fill="#4A5568">전송: 읽은 내용, 출력, 지시만</text>
  <rect x="1078" y="238" width="224" height="26" rx="13" fill="#FFF7ED"/><text x="1190" y="257" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">원자료 파일 업로드 없음</text>
  <circle cx="1090" cy="416" r="20" fill="#EEF1F5"/><g transform="translate(1080,406)" fill="none" stroke="#6A7179" stroke-width="2.5" stroke-linecap="round"><circle cx="8" cy="8" r="7"/><path d="M13,13 l6,6"/></g>
  <text x="1122" y="424" font-size="24" font-weight="700" fill="#14213D">MCP 문헌 검색</text>
  <text x="1078" y="464" font-size="19" fill="#4A5568">PubMed, bioRxiv, Clinical Trials</text>
  <text x="1078" y="492" font-size="19" fill="#4A5568">Scholar Gateway</text>
  <rect x="1078" y="504" width="150" height="26" rx="13" fill="#FFF7ED"/><text x="1153" y="523" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">전송: 검색 질의만</text>
</svg>

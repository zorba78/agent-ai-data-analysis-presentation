<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 300" width="1440" height="300" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B5FA5"/><stop offset="1" stop-color="#38A0F0"/></linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#34507C"/></linearGradient>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F6FA"/></linearGradient>
    <linearGradient id="gAxis" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1400" y2="0"><stop offset="0" stop-color="#C9D0DB"/><stop offset="1" stop-color="#0B5FA5"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.14"/></filter>
    <clipPath id="c0"><rect x="20" y="20" width="440" height="230" rx="22"/></clipPath>
    <clipPath id="c1"><rect x="500" y="20" width="440" height="230" rx="22"/></clipPath>
    <clipPath id="c2"><rect x="980" y="20" width="440" height="230" rx="22"/></clipPath>
  </defs>

  <!-- step 1 -->
  <g filter="url(#sh)"><rect x="20" y="20" width="440" height="230" rx="22" fill="url(#gCard)" stroke="#E3E8EF" stroke-width="1.5"/></g>
  <g clip-path="url(#c0)"><rect x="20" y="20" width="440" height="64" fill="url(#gNavy)"/></g>
  <circle cx="58" cy="52" r="20" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <text x="58" y="60" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="94" y="60" font-size="23" font-weight="700" fill="#FFFFFF">내려받기</text>
  <g transform="translate(400,36)" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16,2 v22 M6,14 l10,10 l10,-10 M2,30 h28"/></g>
  <text x="46" y="122" font-size="21" font-weight="700" fill="#14213D">positron.posit.co/download</text>
  <text x="46" y="158" font-size="19" fill="#4A5568">Windows 10+, macOS 11+, Linux</text>
  <text x="46" y="188" font-size="19" fill="#4A5568">설치 파일 약 500MB, 무료</text>
  <text x="46" y="226" font-size="18" fill="#6A7179">2026.10 기준 버전 2026.10.1</text>

  <!-- step 2 -->
  <g filter="url(#sh)"><rect x="500" y="20" width="440" height="230" rx="22" fill="url(#gCard)" stroke="#E3E8EF" stroke-width="1.5"/></g>
  <g clip-path="url(#c1)"><rect x="500" y="20" width="440" height="64" fill="url(#gNavy)"/></g>
  <circle cx="538" cy="52" r="20" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <text x="538" y="60" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="574" y="60" font-size="23" font-weight="700" fill="#FFFFFF">R 연결</text>
  <g transform="translate(878,36)" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M4,28 L12,10 L18,22 L26,2"/></g>
  <text x="526" y="122" font-size="21" font-weight="700" fill="#14213D">R 4.2 이상 별도 설치</text>
  <text x="526" y="158" font-size="19" fill="#4A5568">설치된 R을 자동 탐지, 버전 선택</text>
  <text x="526" y="188" font-size="19" fill="#4A5568">Windows는 Rtools 따로</text>
  <text x="526" y="226" font-size="18" fill="#6A7179">여러 버전 관리는 rig</text>

  <!-- step 3 -->
  <g filter="url(#sh)"><rect x="980" y="20" width="440" height="230" rx="22" fill="url(#gCard)" stroke="#0B5FA5" stroke-width="2"/></g>
  <g clip-path="url(#c2)"><rect x="980" y="20" width="440" height="64" fill="url(#gBlue)"/></g>
  <circle cx="1018" cy="52" r="20" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1018" y="60" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="1054" y="60" font-size="23" font-weight="700" fill="#FFFFFF">첫 화면</text>
  <g transform="translate(1358,38)" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="30" height="24" rx="4"/><path d="M0,8 h30 M11,8 v16"/></g>
  <text x="1006" y="122" font-size="21" font-weight="700" fill="#14213D">폴더 열기 → R 콘솔 자동 시작</text>
  <text x="1006" y="158" font-size="19" fill="#4A5568">에디터, 콘솔, Variables, Plots</text>
  <text x="1006" y="188" font-size="19" fill="#4A5568">Quarto, Jupyter 기본 내장</text>
  <text x="1006" y="226" font-size="18" fill="#6A7179">RStudio 단축키 설정 가능</text>

  <!-- axis -->
  <rect x="40" y="276" width="1360" height="8" rx="4" fill="url(#gAxis)"/>
</svg>

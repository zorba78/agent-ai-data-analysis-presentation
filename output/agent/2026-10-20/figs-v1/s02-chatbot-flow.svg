<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="aNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213D"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
  </defs>

  <!-- left: researcher PC -->
  <rect x="20" y="20" width="400" height="480" rx="24" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="2"/>
  <text x="50" y="74" font-size="30" font-weight="700" fill="#14213D">내 PC</text>
  <path d="M70,120 h70 l30,30 v110 h-100 z" fill="#DCEAF7" stroke="#0B5FA5" stroke-width="2.5"/>
  <path d="M140,120 v30 h30" fill="none" stroke="#0B5FA5" stroke-width="2.5"/>
  <text x="120" y="215" font-size="22" font-weight="700" fill="#0B5FA5" text-anchor="middle">CSV</text>
  <text x="120" y="300" font-size="24" fill="#14213D" text-anchor="middle">원자료</text>
  <path d="M250,120 h70 l30,30 v110 h-100 z" fill="#F7F7F2" stroke="#6A7179" stroke-width="2.5"/>
  <path d="M320,120 v30 h30" fill="none" stroke="#6A7179" stroke-width="2.5"/>
  <line x1="268" y1="180" x2="332" y2="180" stroke="#6A7179" stroke-width="3"/>
  <line x1="268" y1="200" x2="332" y2="200" stroke="#6A7179" stroke-width="3"/>
  <line x1="268" y1="220" x2="314" y2="220" stroke="#6A7179" stroke-width="3"/>
  <text x="300" y="300" font-size="24" fill="#14213D" text-anchor="middle">원고</text>
  <circle cx="210" cy="372" r="26" fill="#14213D"/>
  <path d="M160,452 q50,-74 100,0 z" fill="#14213D"/>
  <text x="210" y="486" font-size="22" fill="#6A7179" text-anchor="middle">연구자</text>

  <!-- right: web chatbot -->
  <rect x="1020" y="20" width="400" height="480" rx="24" fill="#EEF1F5" stroke="#6A7179" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1050" y="74" font-size="30" font-weight="700" fill="#14213D">웹 챗봇</text>
  <text x="1185" y="74" font-size="22" fill="#6A7179">외부 서버</text>
  <rect x="1045" y="100" width="350" height="375" rx="16" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="2"/>
  <rect x="1135" y="122" width="240" height="92" rx="18" fill="#0B5FA5"/>
  <text x="1155" y="160" font-size="22" fill="#FFFFFF">이 데이터로</text>
  <text x="1155" y="194" font-size="22" fill="#FFFFFF">회귀분석 해줘</text>
  <rect x="1065" y="236" width="270" height="140" rx="18" fill="#EEF1F5"/>
  <text x="1087" y="276" font-size="22" fill="#14213D">결과 표</text>
  <text x="1087" y="312" font-size="22" fill="#14213D">해석 문장</text>
  <text x="1087" y="348" font-size="22" fill="#14213D">예시 코드</text>
  <rect x="1065" y="402" width="310" height="50" rx="25" fill="#F7F7F2" stroke="#D9DEE7" stroke-width="2"/>
  <text x="1090" y="434" font-size="20" fill="#6A7179">메시지 입력</text>

  <!-- arrows -->
  <line x1="440" y1="160" x2="1000" y2="160" stroke="#14213D" stroke-width="4" marker-end="url(#aNavy)"/>
  <rect x="600" y="108" width="240" height="40" rx="20" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="2"/>
  <text x="720" y="136" font-size="22" fill="#14213D" text-anchor="middle">① 파일 업로드</text>

  <line x1="440" y1="280" x2="1000" y2="280" stroke="#14213D" stroke-width="4" marker-end="url(#aNavy)"/>
  <rect x="590" y="228" width="260" height="40" rx="20" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="2"/>
  <text x="720" y="256" font-size="22" fill="#14213D" text-anchor="middle">② 채팅창에 질문</text>

  <line x1="1000" y1="400" x2="440" y2="400" stroke="#D97706" stroke-width="4" marker-end="url(#aOrange)"/>
  <rect x="580" y="348" width="280" height="40" rx="20" fill="#FFF7ED" stroke="#F0C48A" stroke-width="2"/>
  <text x="720" y="376" font-size="22" fill="#B45309" text-anchor="middle">③ 답을 원고로 복사</text>
</svg>

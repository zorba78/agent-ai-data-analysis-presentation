<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker>
    <marker id="aNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14213D"/></marker>
  </defs>

  <!-- panel 1: security -->
  <rect x="0" y="10" width="450" height="500" rx="24" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="2"/>
  <text x="35" y="70" font-size="32" font-weight="700" fill="#14213D">보안</text>
  <circle cx="405" cy="55" r="22" fill="#B42318"/>
  <text x="405" y="65" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
  <rect x="30" y="118" width="175" height="222" rx="14" fill="#DCEAF7"/>
  <text x="117" y="150" font-size="20" fill="#0B5FA5" text-anchor="middle">기관 내부</text>
  <path d="M82,180 h45 l20,20 v74 h-65 z" fill="#FFFFFF" stroke="#0B5FA5" stroke-width="2.5"/>
  <text x="114" y="240" font-size="16" font-weight="700" fill="#0B5FA5" text-anchor="middle">CSV</text>
  <line x1="228" y1="108" x2="228" y2="350" stroke="#B42318" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="160" y1="228" x2="300" y2="228" stroke="#B42318" stroke-width="4" marker-end="url(#aRed)"/>
  <circle cx="338" cy="236" r="28" fill="#EEF1F5"/>
  <circle cx="374" cy="214" r="36" fill="#EEF1F5"/>
  <circle cx="410" cy="238" r="26" fill="#EEF1F5"/>
  <rect x="338" y="236" width="72" height="28" fill="#EEF1F5"/>
  <text x="374" y="300" font-size="20" fill="#6A7179" text-anchor="middle">외부 서버</text>
  <text x="35" y="402" font-size="26" font-weight="500" fill="#14213D">원자료가 외부 서버로</text>
  <text x="35" y="442" font-size="22" fill="#6A7179">IRB 승인 범위</text>
  <text x="35" y="474" font-size="22" fill="#6A7179">군 자료 반출 규정</text>

  <!-- panel 2: context -->
  <rect x="495" y="10" width="450" height="500" rx="24" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="2"/>
  <text x="530" y="70" font-size="32" font-weight="700" fill="#14213D">맥락</text>
  <circle cx="900" cy="55" r="22" fill="#B42318"/>
  <text x="900" y="65" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
  <rect x="535" y="120" width="280" height="150" rx="12" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="2"/>
  <rect x="535" y="120" width="280" height="32" rx="12" fill="#EEF1F5"/>
  <text x="550" y="143" font-size="18" fill="#6A7179">새 대화</text>
  <rect x="565" y="160" width="280" height="150" rx="12" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="2"/>
  <rect x="565" y="160" width="280" height="32" rx="12" fill="#EEF1F5"/>
  <text x="580" y="183" font-size="18" fill="#6A7179">새 대화</text>
  <rect x="595" y="200" width="290" height="150" rx="12" fill="#FFFFFF" stroke="#6A7179" stroke-width="2"/>
  <rect x="595" y="200" width="290" height="32" rx="12" fill="#EEF1F5"/>
  <text x="610" y="223" font-size="18" fill="#6A7179">새 대화</text>
  <text x="615" y="275" font-size="22" fill="#14213D">변수 정의부터</text>
  <text x="615" y="310" font-size="22" fill="#14213D">다시 설명</text>
  <text x="530" y="402" font-size="26" font-weight="500" fill="#14213D">대화마다 처음부터 설명</text>
  <text x="530" y="442" font-size="22" fill="#6A7179">변수 정의, 제외 기준</text>
  <text x="530" y="474" font-size="22" fill="#6A7179">지난 분석 결정</text>

  <!-- panel 3: reproducibility -->
  <rect x="990" y="10" width="450" height="500" rx="24" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="2"/>
  <text x="1025" y="70" font-size="32" font-weight="700" fill="#14213D">재현</text>
  <circle cx="1395" cy="55" r="22" fill="#B42318"/>
  <text x="1395" y="65" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
  <rect x="1020" y="190" width="104" height="72" rx="12" fill="#DCEAF7"/>
  <text x="1072" y="235" font-size="24" fill="#14213D" text-anchor="middle">코드</text>
  <rect x="1160" y="190" width="104" height="72" rx="12" fill="#DCEAF7"/>
  <text x="1212" y="235" font-size="24" fill="#14213D" text-anchor="middle">결과</text>
  <rect x="1310" y="190" width="104" height="72" rx="12" fill="#F7F7F2" stroke="#6A7179" stroke-width="2"/>
  <text x="1362" y="235" font-size="24" fill="#14213D" text-anchor="middle">원고</text>
  <line x1="1124" y1="226" x2="1156" y2="226" stroke="#14213D" stroke-width="4" marker-end="url(#aNavy)"/>
  <line x1="1264" y1="226" x2="1278" y2="226" stroke="#B42318" stroke-width="4"/>
  <line x1="1296" y1="226" x2="1310" y2="226" stroke="#B42318" stroke-width="4"/>
  <line x1="1280" y1="214" x2="1294" y2="238" stroke="#B42318" stroke-width="4"/>
  <line x1="1294" y1="214" x2="1280" y2="238" stroke="#B42318" stroke-width="4"/>
  <text x="1287" y="300" font-size="20" fill="#B42318" text-anchor="middle">손으로 복사</text>
  <text x="1025" y="402" font-size="26" font-weight="500" fill="#14213D">코드, 결과, 원고가 끊김</text>
  <text x="1025" y="442" font-size="22" fill="#6A7179">숫자를 옮기는 순간</text>
  <text x="1025" y="474" font-size="22" fill="#6A7179">검증 경로가 끊김</text>
</svg>

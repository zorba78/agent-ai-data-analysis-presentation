<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A7179"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B5FA5"/></marker>
  </defs>

  <!-- local group -->
  <rect x="20" y="150" width="360" height="220" rx="20" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="2"/>
  <text x="44" y="190" font-size="22" fill="#6A7179">내 PC</text>
  <rect x="50" y="212" width="300" height="124" rx="14" fill="#DCEAF7"/>
  <text x="72" y="260" font-size="26" font-weight="700" fill="#14213D">Positron MCP</text>
  <text x="72" y="300" font-size="20" fill="#4A5568">R 세션 실행, 객체 조회</text>

  <!-- external group -->
  <rect x="1000" y="10" width="420" height="500" rx="20" fill="#FFFFFF" stroke="#6A7179" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1022" y="48" font-size="22" fill="#6A7179">외부 검색, 질의만 전송</text>

  <rect x="1022" y="70" width="376" height="96" rx="14" fill="#F7F7F2" stroke="#D9DEE7" stroke-width="2"/>
  <text x="1044" y="108" font-size="24" font-weight="700" fill="#14213D">PubMed</text>
  <text x="1044" y="144" font-size="20" fill="#4A5568">서지 정보, 인용 문구로 논문 찾기</text>

  <rect x="1022" y="178" width="376" height="96" rx="14" fill="#F7F7F2" stroke="#D9DEE7" stroke-width="2"/>
  <text x="1044" y="216" font-size="24" font-weight="700" fill="#14213D">bioRxiv</text>
  <text x="1044" y="252" font-size="20" fill="#4A5568">bioRxiv, medRxiv 프리프린트</text>

  <rect x="1022" y="286" width="376" height="96" rx="14" fill="#F7F7F2" stroke="#D9DEE7" stroke-width="2"/>
  <text x="1044" y="324" font-size="24" font-weight="700" fill="#14213D">Clinical Trials</text>
  <text x="1044" y="360" font-size="20" fill="#4A5568">ClinicalTrials.gov 등록 시험</text>

  <rect x="1022" y="394" width="376" height="96" rx="14" fill="#F7F7F2" stroke="#D9DEE7" stroke-width="2"/>
  <text x="1044" y="432" font-size="24" font-weight="700" fill="#14213D">Scholar Gateway</text>
  <text x="1044" y="468" font-size="20" fill="#4A5568">학술 문헌 검색</text>

  <!-- edges -->
  <line x1="354" y1="274" x2="616" y2="260" stroke="#0B5FA5" stroke-width="3" marker-start="url(#aB)" marker-end="url(#aB)"/>
  <text x="485" y="248" font-size="20" fill="#0B5FA5" text-anchor="middle">R 세션 연결</text>
  <line x1="824" y1="250" x2="1018" y2="118" stroke="#6A7179" stroke-width="2.5" marker-end="url(#aG)"/>
  <line x1="824" y1="256" x2="1018" y2="226" stroke="#6A7179" stroke-width="2.5" marker-end="url(#aG)"/>
  <line x1="824" y1="264" x2="1018" y2="334" stroke="#6A7179" stroke-width="2.5" marker-end="url(#aG)"/>
  <line x1="824" y1="270" x2="1018" y2="442" stroke="#6A7179" stroke-width="2.5" marker-end="url(#aG)"/>

  <!-- hub -->
  <rect x="620" y="210" width="200" height="100" rx="18" fill="#0B5FA5"/>
  <text x="720" y="268" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Claude Code</text>
  <text x="720" y="354" font-size="20" fill="#6A7179" text-anchor="middle">문헌 탐색 단계에서 호출</text>
</svg>

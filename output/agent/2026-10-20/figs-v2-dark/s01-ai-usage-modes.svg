<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" width="1440" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C2B4A"/><stop offset="1" stop-color="#3A4F7A"/></linearGradient>
    <linearGradient id="gGrey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B6572"/><stop offset="1" stop-color="#8A94A1"/></linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F4A6E"/><stop offset="1" stop-color="#5B7CA6"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B5FA5"/><stop offset="1" stop-color="#2E8FE0"/></linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D97706"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="gAxis" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1370" y2="0"><stop offset="0" stop-color="#C9D0DB"/><stop offset="1" stop-color="#0B5FA5"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.14"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0B5FA5" flood-opacity="0.35"/></filter>
    <clipPath id="c0"><rect x="20" y="16" width="325" height="420" rx="22"/></clipPath>
    <clipPath id="c1"><rect x="375" y="16" width="325" height="420" rx="22"/></clipPath>
    <clipPath id="c2"><rect x="730" y="16" width="325" height="420" rx="22"/></clipPath>
    <clipPath id="c3"><rect x="1085" y="16" width="325" height="420" rx="22"/></clipPath>
  </defs>

  <!-- card 1: chatbot -->
  <g filter="url(#sh)"><rect x="20" y="16" width="325" height="420" rx="22" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/></g>
  <g clip-path="url(#c0)"><rect x="20" y="16" width="325" height="118" fill="url(#gGrey)"/><circle cx="330" cy="30" r="70" fill="#FFFFFF" fill-opacity="0.08"/></g>
  <circle cx="68" cy="75" r="28" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <text x="68" y="85" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <g transform="translate(248,44)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,10 a10,10 0 0 1 10,-10 h56 a10,10 0 0 1 10,10 v30 a10,10 0 0 1 -10,10 h-34 l-16,14 v-14 h-6 a10,10 0 0 1 -10,-10 z"/>
    <circle cx="22" cy="25" r="2.5" fill="#FFFFFF"/><circle cx="38" cy="25" r="2.5" fill="#FFFFFF"/><circle cx="54" cy="25" r="2.5" fill="#FFFFFF"/>
  </g>
  <text x="48" y="186" font-size="28" font-weight="700" fill="#14213D">웹 챗봇 질문</text>
  <text x="48" y="232" font-size="21" fill="#4A5568">질문 입력, 답 읽기</text>
  <text x="48" y="268" font-size="21" fill="#4A5568">코드, 문장을 복사해 사용</text>
  <text x="48" y="304" font-size="21" fill="#4A5568">데이터는 올리지 않음</text>
  <rect x="48" y="352" width="246" height="42" rx="21" fill="#EEF1F5"/>
  <text x="171" y="380" font-size="19" fill="#6A7179" text-anchor="middle">사람이 잇는 일: 전부</text>

  <!-- card 2: upload -->
  <g filter="url(#sh)"><rect x="375" y="16" width="325" height="420" rx="22" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/></g>
  <g clip-path="url(#c1)"><rect x="375" y="16" width="325" height="118" fill="url(#gSlate)"/><circle cx="685" cy="30" r="70" fill="#FFFFFF" fill-opacity="0.08"/></g>
  <circle cx="423" cy="75" r="28" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <text x="423" y="85" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <g transform="translate(603,44)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4,42 v10 a6,6 0 0 0 6,6 h56 a6,6 0 0 0 6,-6 v-10"/>
    <path d="M38,42 v-38 M22,20 l16,-16 l16,16"/>
  </g>
  <text x="403" y="186" font-size="28" font-weight="700" fill="#14213D">파일 업로드 분석</text>
  <text x="403" y="232" font-size="21" fill="#4A5568">CSV, PDF를 채팅창에 업로드</text>
  <text x="403" y="268" font-size="21" fill="#4A5568">챗봇이 코드 실행, 표와 그림 생성</text>
  <text x="403" y="304" font-size="21" fill="#4A5568">원자료가 외부 서버로 이동</text>
  <rect x="403" y="352" width="246" height="42" rx="21" fill="#EEF1F5"/>
  <text x="526" y="380" font-size="19" fill="#6A7179" text-anchor="middle">사람이 잇는 일: 전송, 복사</text>

  <!-- card 3: completion -->
  <g filter="url(#sh)"><rect x="730" y="16" width="325" height="420" rx="22" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/></g>
  <g clip-path="url(#c2)"><rect x="730" y="16" width="325" height="118" fill="url(#gNavy)"/><circle cx="1040" cy="30" r="70" fill="#FFFFFF" fill-opacity="0.08"/></g>
  <circle cx="778" cy="75" r="28" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <text x="778" y="85" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <g transform="translate(958,44)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22,8 l-18,24 l18,24 M54,8 l18,24 l-18,24 M44,4 l-12,56"/>
  </g>
  <text x="758" y="186" font-size="28" font-weight="700" fill="#14213D">에디터 자동완성</text>
  <text x="758" y="232" font-size="21" fill="#4A5568">Copilot, Positron Assistant</text>
  <text x="758" y="268" font-size="21" fill="#4A5568">코드 한 줄, 함수 단위 제안</text>
  <text x="758" y="304" font-size="21" fill="#4A5568">실행과 확인은 내가</text>
  <rect x="758" y="352" width="246" height="42" rx="21" fill="#EEF1F5"/>
  <text x="881" y="380" font-size="19" fill="#6A7179" text-anchor="middle">사람이 잇는 일: 실행, 판단</text>

  <!-- card 4: agent -->
  <g filter="url(#glow)"><rect x="1085" y="16" width="325" height="420" rx="22" fill="#FFFFFF" stroke="#0B5FA5" stroke-width="3"/></g>
  <g clip-path="url(#c3)"><rect x="1085" y="16" width="325" height="118" fill="url(#gBlue)"/><circle cx="1395" cy="30" r="70" fill="#FFFFFF" fill-opacity="0.12"/></g>
  <circle cx="1133" cy="75" r="28" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1133" y="85" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <g transform="translate(1313,44)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="76" height="60" rx="8"/>
    <path d="M16,20 l14,11 l-14,11 M38,42 h22"/>
  </g>
  <rect x="1290" y="150" width="100" height="34" rx="17" fill="url(#gOrange)"/>
  <text x="1340" y="174" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">오늘 주제</text>
  <text x="1113" y="186" font-size="28" font-weight="700" fill="#14213D">에이전트</text>
  <text x="1113" y="232" font-size="21" fill="#4A5568">Claude Code가 내 PC에서 실행</text>
  <text x="1113" y="268" font-size="21" fill="#4A5568">파일 읽기, 쓰기, 코드 실행</text>
  <text x="1113" y="304" font-size="21" fill="#4A5568">내 R 세션, 레포, 규칙을 직접 사용</text>
  <rect x="1113" y="352" width="246" height="42" rx="21" fill="#DCEAF7"/>
  <text x="1236" y="380" font-size="19" font-weight="700" fill="#0B5FA5" text-anchor="middle">사람이 잇는 일: 결정</text>

  <!-- axis -->
  <rect x="40" y="483" width="1330" height="10" rx="5" fill="url(#gAxis)"/>
  <polygon points="1366,470 1400,488 1366,506" fill="#0B5FA5"/>
  <text x="40" y="538" font-size="22" fill="#6A7179">사람이 손으로 잇는 일 많음</text>
  <text x="1400" y="538" font-size="22" font-weight="700" fill="#0B5FA5" text-anchor="end">에이전트가 스스로 하는 범위 큼</text>
</svg>

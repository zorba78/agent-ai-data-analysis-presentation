  <text x="530" y="474" font-size="22" fill="#6A7179">지난 분석 결정</text>

  <!-- panel 3: reproducibility -->
  <g filter="url(#sh)"><rect x="990" y="10" width="440" height="500" rx="26" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/></g>
  <circle cx="1060" cy="76" r="36" fill="url(#gNavy)"/>
  <g transform="translate(1040,60)" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">

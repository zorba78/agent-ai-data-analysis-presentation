  <text x="1362" y="245" font-size="24" fill="#14213D" text-anchor="middle">원고</text>
  <path d="M1124,236 L1152,236" stroke="#14213D" stroke-width="4" marker-end="url(#aNavy)"/>
  <line x1="1264" y1="236" x2="1278" y2="236" stroke="#B42318" stroke-width="4" stroke-linecap="round"/>
  <line x1="1296" y1="236" x2="1310" y2="236" stroke="#B42318" stroke-width="4" stroke-linecap="round"/>
  <line x1="1280" y1="224" x2="1294" y2="248" stroke="#B42318" stroke-width="4" stroke-linecap="round"/>

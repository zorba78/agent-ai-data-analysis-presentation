  <g opacity="0.45"><rect x="540" y="140" width="280" height="150" rx="14" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="2"/><rect x="540" y="140" width="280" height="34" rx="14" fill="#EEF1F5"/><rect x="540" y="158" width="280" height="16" fill="#EEF1F5"/><text x="556" y="164" font-size="18" fill="#6A7179">새 대화</text></g>
  <g opacity="0.7"><rect x="570" y="176" width="280" height="150" rx="14" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="2"/><rect x="570" y="176" width="280" height="34" rx="14" fill="#EEF1F5"/><rect x="570" y="194" width="280" height="16" fill="#EEF1F5"/><text x="586" y="200" font-size="18" fill="#6A7179">새 대화</text></g>
  <g filter="url(#sh2)"><rect x="600" y="212" width="290" height="150" rx="14" fill="#FFFFFF" stroke="#8A94A1" stroke-width="2"/></g>
  <rect x="600" y="212" width="290" height="34" rx="14" fill="#EEF1F5"/><rect x="600" y="230" width="290" height="16" fill="#EEF1F5"/>

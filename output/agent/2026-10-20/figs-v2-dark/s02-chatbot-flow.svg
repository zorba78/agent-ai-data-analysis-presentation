<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B5FA5"/><stop offset="1" stop-color="#2E8FE0"/></linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D97706"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#2F4A6E"/></linearGradient>
    <linearGradient id="gCsv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8F1FA"/><stop offset="1" stop-color="#CFE2F4"/></linearGradient>
    <linearGradient id="gCloud" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6EAF0"/><stop offset="1" stop-color="#D5DBE4"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.14"/></filter>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#14213D" flood-opacity="0.12"/></filter>
    <marker id="aNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14213D"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
  </defs>

  <!-- left: researcher PC -->
  <g filter="url(#sh)"><rect x="20" y="20" width="400" height="480" rx="26" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/></g>
  <rect x="20" y="20" width="400" height="8" rx="4" fill="url(#gNavy)"/>
  <text x="50" y="76" font-size="30" font-weight="700" fill="#14213D">내 PC</text>
  <g filter="url(#sh2)">
    <path d="M70,120 h70 l30,30 v110 a10,10 0 0 1 -10,10 h-90 a10,10 0 0 1 -10,-10 v-130 a10,10 0 0 1 10,-10 z" fill="url(#gCsv)" stroke="#0B5FA5" stroke-width="2"/>
  </g>
  <path d="M140,120 v30 h30" fill="none" stroke="#0B5FA5" stroke-width="2"/>
  <rect x="86" y="200" width="68" height="30" rx="8" fill="#0B5FA5"/>
  <text x="120" y="222" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">CSV</text>
  <text x="120" y="300" font-size="24" fill="#14213D" text-anchor="middle">원자료</text>
  <g filter="url(#sh2)">
    <path d="M250,120 h70 l30,30 v110 a10,10 0 0 1 -10,10 h-90 a10,10 0 0 1 -10,-10 v-130 a10,10 0 0 1 10,-10 z" fill="#FBFBF8" stroke="#8A94A1" stroke-width="2"/>
  </g>
  <path d="M320,120 v30 h30" fill="none" stroke="#8A94A1" stroke-width="2"/>
  <line x1="266" y1="178" x2="334" y2="178" stroke="#B9C1CC" stroke-width="4" stroke-linecap="round"/>
  <line x1="266" y1="200" x2="334" y2="200" stroke="#B9C1CC" stroke-width="4" stroke-linecap="round"/>
  <line x1="266" y1="222" x2="312" y2="222" stroke="#B9C1CC" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="300" font-size="24" fill="#14213D" text-anchor="middle">원고</text>
  <circle cx="210" cy="370" r="27" fill="url(#gOrange)"/>
  <path d="M156,452 q54,-76 108,0 z" fill="url(#gOrange)"/>
  <text x="210" y="486" font-size="22" fill="#6A7179" text-anchor="middle">연구자</text>

  <!-- right: web chatbot -->
  <g filter="url(#sh)"><rect x="1020" y="20" width="400" height="480" rx="26" fill="url(#gCloud)" stroke="#C9D0DB" stroke-width="1.5"/></g>
  <rect x="1020" y="20" width="400" height="480" rx="26" fill="none" stroke="#8A94A1" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1050" y="76" font-size="30" font-weight="700" fill="#14213D">웹 챗봇</text>
  <text x="1185" y="76" font-size="22" fill="#6A7179">외부 서버</text>
  <g filter="url(#sh2)"><rect x="1045" y="100" width="350" height="375" rx="18" fill="#FFFFFF"/></g>
  <rect x="1045" y="100" width="350" height="36" rx="18" fill="#F3F5F8"/>
  <rect x="1045" y="118" width="350" height="18" fill="#F3F5F8"/>
  <circle cx="1068" cy="118" r="5" fill="#E05B5B"/><circle cx="1086" cy="118" r="5" fill="#F0B640"/><circle cx="1104" cy="118" r="5" fill="#5BC06A"/>
  <rect x="1135" y="150" width="240" height="90" rx="20" fill="url(#gBlue)"/>
  <text x="1157" y="188" font-size="22" fill="#FFFFFF">이 데이터로</text>
  <text x="1157" y="222" font-size="22" fill="#FFFFFF">회귀분석 해줘</text>
  <rect x="1065" y="258" width="270" height="134" rx="20" fill="#EEF1F5"/>
  <text x="1087" y="298" font-size="22" fill="#14213D">결과 표</text>
  <text x="1087" y="334" font-size="22" fill="#14213D">해석 문장</text>
  <text x="1087" y="370" font-size="22" fill="#14213D">예시 코드</text>
  <rect x="1065" y="412" width="310" height="46" rx="23" fill="#F7F7F2" stroke="#D9DEE7" stroke-width="2"/>
  <text x="1090" y="442" font-size="20" fill="#6A7179">메시지 입력</text>

  <!-- arrows -->
  <path d="M440,150 C600,120 860,120 1000,150" fill="none" stroke="#14213D" stroke-width="4" marker-end="url(#aNavy)"/>
  <g filter="url(#sh2)"><rect x="600" y="104" width="240" height="44" rx="22" fill="#FFFFFF"/></g>
  <text x="720" y="133" font-size="22" font-weight="500" fill="#14213D" text-anchor="middle">① 파일 업로드</text>

  <path d="M440,270 L1000,270" fill="none" stroke="#14213D" stroke-width="4" marker-end="url(#aNavy)"/>
  <g filter="url(#sh2)"><rect x="590" y="224" width="260" height="44" rx="22" fill="#FFFFFF"/></g>
  <text x="720" y="253" font-size="22" font-weight="500" fill="#14213D" text-anchor="middle">② 채팅창에 질문</text>

  <path d="M1000,400 C860,430 600,430 440,400" fill="none" stroke="#D97706" stroke-width="4" marker-end="url(#aOrange)"/>
  <g filter="url(#sh2)"><rect x="580" y="350" width="280" height="44" rx="22" fill="#FFF7ED" stroke="#F0C48A" stroke-width="1.5"/></g>
  <text x="720" y="379" font-size="22" font-weight="500" fill="#B45309" text-anchor="middle">③ 답을 원고로 복사</text>
</svg>
